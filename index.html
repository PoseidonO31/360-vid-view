<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>360° Video</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; }

    /* Start overlay (browsers block autoplay until user interacts) */
    #overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: rgba(0,0,0,0.7); color: #fff; cursor: pointer; z-index: 10;
    }
    #overlay .play {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 2px solid #fff;
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    #overlay p { font-size: 18px; opacity: 0.85; }

    /* Control bar */
    #controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; z-index: 5;
      background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 999px;
    }
    #controls button {
      background: rgba(255,255,255,0.12); color: #fff; border: none;
      border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer;
    }
    #controls button:hover { background: rgba(255,255,255,0.25); }
    #controls button.active { background: #fff; color: #000; }
  </style>
</head>
<body>

  <!-- ① Put your exported Insta360 MP4 in the same folder as this file,
       and set its name here. -->
  <video id="video" src="my360video.mp4" playsinline muted loop preload="auto" crossorigin="anonymous"></video>

  <div id="overlay">
    <div class="play">▶</div>
    <p>Tap to play — then drag to look around</p>
  </div>

  <div id="controls">
    <button id="btnMute">🔇 Mute</button>
    <button id="btnGyro">📱 Gyro</button>
    <button id="btnFullscreen">⛶ Fullscreen</button>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const controls = document.getElementById('controls');

    // --- Three.js scene: video mapped inside a sphere ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 200);

    const texture = new THREE.VideoTexture(video);
    texture.minFilter = THREE.LinearFilter;   // required (video isn't power-of-two)
    texture.magFilter = THREE.LinearFilter;

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(50, 60, 40),
      new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide })
    );
    scene.add(sphere);

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- Look-around controls (mouse + touch, with a little inertia) ---
    let yaw = 0, pitch = 0;          // radians
    let velYaw = 0, velPitch = 0;
    let dragging = false, lastX = 0, lastY = 0;
    const SENSITIVITY = 0.005;
    const DAMPING = 0.92;

    function onDown(x, y) { dragging = true; lastX = x; lastY = y; velYaw = velPitch = 0; }
    function onMove(x, y) {
      if (!dragging) return;
      velYaw   = -(x - lastX) * SENSITIVITY;
      velPitch = -(y - lastY) * SENSITIVITY;
      yaw   += velYaw;
      pitch += velPitch;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));   // don't flip over the poles
      lastX = x; lastY = y;
    }
    function onUp() { dragging = false; }

    // Mouse
    renderer.domElement.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
    addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    addEventListener('mouseup', onUp);

    // Touch
    renderer.domElement.addEventListener('touchstart', e => { const t = e.touches[0]; onDown(t.clientX, t.clientY); }, { passive: true });
    renderer.domElement.addEventListener('touchmove',  e => { const t = e.touches[0]; onMove(t.clientX, t.clientY); }, { passive: true });
    renderer.domElement.addEventListener('touchend', onUp);

    // --- Gyroscope (mobile) ---
    let gyroOn = false;
    addEventListener('deviceorientation', e => {
      if (!gyroOn || e.beta === null) return;
      pitch = THREE.MathUtils.degToRad(e.beta - 90) * -1;
      pitch = Math.max(-1.4, Math.min(1.4, pitch));
      yaw   = THREE.MathUtils.degToRad(e.gamma);
    });
    async function enableGyro() {
      if (DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const res = await DeviceOrientationEvent.requestPermission();
        if (res !== 'granted') return false;
      }
      gyroOn = true;
      document.getElementById('btnGyro').classList.add('active');
      return true;
    }

    // --- UI wiring ---
overlay.addEventListener('click', async () => {
  // Prevent multiple calls if already playing
  if (!video.paused) return;
  
  try {
    await video.play(); 

    // Use a small timeout to ensure the video element gets time to load/play before hiding the overlay
    setTimeout(() => {
        overlay.style.display = 'none';
        controls.style.display = 'flex';
    }, 100); 

  } catch (err) {
    // This handles common browser autoplay policy errors
    console.error('Error playing video:', err);
    alert('Please click again, or ensure the video is available.');
  }
});

    const btnMute = document.getElementById('btnMute');
    btnMute.addEventListener('click', () => {
      video.muted = !video.muted;
      btnMute.textContent = video.muted ? '🔇 Mute' : '🔊 Unmute';
      btnMute.classList.toggle('active', !video.muted);
    });

    document.getElementById('btnGyro').addEventListener('click', () => {
      if (!gyroOn) enableGyro();
      else { gyroOn = false; document.getElementById('btnGyro').classList.remove('active'); }
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
